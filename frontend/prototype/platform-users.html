<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用户管理 · 平台管理后台</title>
<link rel="stylesheet" href="assets/common.css">
</head>
<body>
<main class="content" id="pageContent">
  <div class="page-head">
    <h1>用户管理</h1>
    <p>全平台账号治理，覆盖游客与管理员；内置超级管理员账号不可禁用或变更角色。数据来自 <code>/platform/users</code>。</p>
  </div>

  <div class="card">
    <div class="filters">
      <div class="field"><label>关键词</label><input type="text" id="f-keyword" placeholder="昵称 / 登录名 / 手机号"></div>
      <div class="field"><label>角色类型</label>
        <select id="f-type"><option value="">全部</option><option value="TOURIST">游客</option><option value="ADMIN">管理员</option></select>
      </div>
      <div class="field"><label>状态</label>
        <select id="f-status"><option value="">全部</option><option value="ACTIVE">正常</option><option value="DISABLED">禁用</option></select>
      </div>
      <div class="field"><label>所属旅行社</label><select id="f-agency"><option value="">全部</option></select></div>
      <div class="field"><label>&nbsp;</label><button class="btn btn-primary" type="button" id="btn-search">查询</button></div>
    </div>
    <div class="toolbar">
      <button class="btn btn-primary" type="button" id="btn-add">+ 新增账号</button>
      <button class="btn btn-outline" type="button" id="btn-export">导出（脱敏）</button>
    </div>
    <div class="table-wrap">
      <table class="grid-table">
        <colgroup><col style="width:6%"><col style="width:13%"><col style="width:13%"><col style="width:14%"><col style="width:16%"><col style="width:16%"><col style="width:9%"><col style="width:13%"></colgroup>
        <thead><tr><th>ID</th><th>昵称</th><th>登录名</th><th>脱敏手机号</th><th>角色</th><th>所属机构</th><th>状态</th><th>最近登录 / 操作</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="8" class="muted">加载中…</td></tr></tbody>
      </table>
    </div>
    <div class="pagination" id="pager"></div>
  </div>
</main>

<script src="assets/api.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/nav.js"></script>
<script>
AdminLayout.mount({ role: "platform", active: "users", title: "用户管理", crumb: "治理与交易" });

(function () {
  var api = window.WebApi, U = window.UI;
  var state = { page: 1, size: 10, total: 0 };
  var canUpdate = api.perm("system:user:update");
  var canAdd = api.perm("system:user:add");
  var roleOptions = [];
  var lastList = [];
  var TYPE_TAG = { TOURIST: '<span class="tag tag-muted">游客</span>', ADMIN: '<span class="tag tag-info">管理员</span>' };

  function val(sel) { var el = document.querySelector(sel); return el ? el.value.trim() : ""; }

  // 初始化机构下拉与角色选项
  function initMeta() {
    api.call("/platform/agencies?size=100", "GET").then(function (d) {
      var sel = document.getElementById("f-agency");
      d.list.forEach(function (a) {
        var opt = document.createElement("option");
        opt.value = a.agency_id; opt.textContent = a.agency_name;
        sel.appendChild(opt);
      });
    }).catch(function () { /* 筛选项加载失败不阻断列表 */ });

    return api.call("/roles?page=1&size=50", "GET").then(function (d) {
      roleOptions = d.list.map(function (r) { return { role_id: String(r.role_id), name: r.name }; });
    }).catch(function () {
      // 无角色查询权限时使用种子角色兜底
      roleOptions = [
        { role_id: "1", name: "游客" }, { role_id: "2", name: "旅行社管理员" },
        { role_id: "3", name: "超级管理员" }, { role_id: "4", name: "旅行社专员" }
      ];
    });
  }

  function load() {
    var params = {
      page: state.page, size: state.size,
      keyword: val("#f-keyword"), user_type: val("#f-type"),
      status: val("#f-status"), agency_id: val("#f-agency")
    };
    api.call("/platform/users" + U.query(params), "GET").then(function (data) {
      state.total = data.total;
      lastList = data.list;
      U.fillTbody("#tbody", data.list, function (r) {
        var isSuper = r.username === "super";
        var ops;
        if (isSuper) {
          ops = '<div class="muted" style="font-size:11px">内置账号，不可禁用 / 变更角色</div>';
        } else {
          ops = '<div class="cell-actions">';
          if (canUpdate) {
            ops += '<button class="btn-link" data-act="roles" data-i="' + r.user_id + '">分配角色</button>';
            ops += '<button class="btn-link ' + (r.status === "ACTIVE" ? "danger" : "") + '" data-act="toggle" data-i="' + r.user_id + '">' + (r.status === "ACTIVE" ? "禁用" : "启用") + "</button>";
          } else {
            ops += '<span class="muted" style="font-size:11px">只读</span>';
          }
          ops += "</div>";
        }
        return "<tr><td>" + U.esc(r.user_id) + "</td><td>" + U.esc(r.nickname || "—") + "</td><td>" + U.esc(r.username) + "</td>" +
          "<td>" + U.esc(r.masked_phone || "—") + "</td>" +
          "<td>" + (TYPE_TAG[r.user_type] || "") + (r.role_names ? '<div class="muted" style="font-size:11px">' + U.esc(r.role_names) + "</div>" : "") + "</td>" +
          "<td>" + (r.agency_name ? U.esc(r.agency_name) : '<span class="muted">—</span>') + "</td>" +
          "<td>" + U.tag("ACCOUNT", r.status) + "</td>" +
          "<td>" + U.dateTime(r.last_login_at) + ops + "</td></tr>";
      });
      U.pagination("#pager", { total: state.total, size: state.size, page: state.page, onPage: function (p) { state.page = p; load(); } });
    }).catch(U.toastError);
  }

  function rowById(userId) {
    for (var i = 0; i < lastList.length; i++) if (String(lastList[i].user_id) === String(userId)) return lastList[i];
    return null;
  }

  // 分配角色（多选弹窗）
  function openRoles(userId) {
    var row = rowById(userId);
    if (!roleOptions.length) { global.toast("角色选项加载失败，请刷新重试"); return; }
    var html = '<div style="display:flex;flex-direction:column;gap:8px">' +
      roleOptions.map(function (r, i) {
        return '<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="role-opt" value="' + U.esc(r.role_id) + '"> ' + U.esc(r.name) + "（ID " + U.esc(r.role_id) + "）</label>";
      }).join("") + "</div>" +
      '<div class="muted" style="font-size:12px;margin-top:10px">分配为全量覆盖：保存后该账号仅保留勾选的角色。</div>';
    var handle = U.modal({
      title: "分配角色 · " + (row ? row.nickname || row.username : userId),
      body: function (body) { body.innerHTML = html; },
      buttons: [
        { label: "取消", style: "btn-outline", onClick: function (close) { close(); } },
        {
          label: "保存", style: "btn-primary",
          onClick: function (close, btn) {
            var checked = Array.prototype.slice.call(handle.body.querySelectorAll('[name="role-opt"]:checked')).map(function (c) { return c.value; });
            if (!checked.length) { global.toast("请至少勾选一个角色"); return; }
            btn.disabled = true;
            api.call("/platform/users/" + userId + "/roles", "POST", { role_ids: checked })
              .then(function () { close(); global.toast("角色已更新"); load(); })
              .catch(function (err) { btn.disabled = false; U.toastError(err); });
          }
        }
      ]
    });
  }

  // 启用 / 禁用
  function toggle(userId) {
    var row = rowById(userId);
    var toDisable = row && row.status === "ACTIVE";
    U.confirmDialog(
      (toDisable ? "禁用账号「" : "启用账号「") + (row ? row.username : userId) + "」？" +
      (toDisable ? "禁用后立即撤销该账号全部会话。" : ""),
      function (close) {
        api.call("/platform/users/" + userId, "PATCH", { status: toDisable ? "DISABLED" : "ACTIVE" })
          .then(function () { close(); global.toast(toDisable ? "账号已禁用" : "账号已启用"); load(); })
          .catch(function (err) { U.toastError(err); });
      }, toDisable);
  }

  // 新增账号（mobile 即登录名）
  function openAdd() {
    U.formModal({
      title: "新增账号",
      note: "登录名即手机号；创建后可在列表中为其分配更多角色。",
      fields: [
        { key: "mobile", label: "手机号（登录名）", required: true, placeholder: "如：13800001234" },
        { key: "nickname", label: "昵称", placeholder: "展示昵称" },
        { key: "password", label: "初始密码", type: "password", required: true, placeholder: "至少 8 位" },
        { key: "role_ids", label: "角色 ID（多个用英文逗号分隔）", required: true, placeholder: "如：1 或 2,4" }
      ],
      submitLabel: "创建账号",
      onSubmit: function (values) {
        var roleIds = values.role_ids.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
        return api.call("/admin/users", "POST", {
          mobile: values.mobile, password: values.password,
          nickname: values.nickname || undefined, role_ids: roleIds
        }).then(function () { global.toast("账号已创建"); load(); });
      }
    });
  }

  document.getElementById("tbody").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-act]");
    if (!btn) return;
    var userId = btn.getAttribute("data-i");
    if (btn.getAttribute("data-act") === "roles") openRoles(userId);
    else if (btn.getAttribute("data-act") === "toggle") toggle(userId);
  });
  document.getElementById("btn-search").addEventListener("click", function () { state.page = 1; load(); });
  document.getElementById("f-keyword").addEventListener("keydown", function (e) { if (e.key === "Enter") { state.page = 1; load(); } });
  document.getElementById("btn-add").addEventListener("click", function () {
    if (!canAdd) { global.toast("暂无新增账号权限"); return; }
    openAdd();
  });
  document.getElementById("btn-export").addEventListener("click", function () {
    U.downloadCsv("用户列表.csv", [
      { label: "ID", key: "user_id" }, { label: "昵称", key: "nickname" },
      { label: "登录名", key: "username" }, { label: "手机号（脱敏）", key: "masked_phone" },
      { label: "角色", key: "role_names" }, { label: "所属机构", key: "agency_name" },
      { label: "状态", key: "status" }, { label: "最近登录", key: "last_login_at" }
    ], lastList);
  });

  initMeta().then(load);
})();
</script>
</body>
</html>
