server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        path: /
        # 生产开启 HTTPS 后置为 true（本地 http 调试必须为 false，否则收不到 Cookie）
        secure: false

spring:
  application:
    name: admin-web
  # 有意不再设置默认 profile：开发登录口（DevAuthController）已在 S2 删除，
  # 任何环境都必须走 Node 真实账号 + 图形验证码。
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  node:
    # Node 业务 API（唯一写库方）。部署到容器时用环境变量指到服务名。
    base-url: ${NODE_BASE_URL:http://127.0.0.1:3001}
    connect-timeout: 2s
    read-timeout: 3s
  security:
    # 浏览器侧只持会话 Cookie，不得下发任何 token
    session-header-name: X-Trace-Id

logging:
  level:
    com.example.adminweb: INFO
    org.springframework.security: INFO
