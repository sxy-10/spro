# ============================================================
# 组员6 · 阶段二：Nginx 反向代理 + 限流
# 仓库存档版：deploy/nginx/nginx.conf（交付/diff 用，本文件）
# 运行方式（prefix 指向 E:/colledge/three/softwareprojects/testall）：
#   D:/waimai/nginx-1.20.2/nginx.exe -p "E:/colledge/three/softwareprojects/testall" -c nginx.conf
# 执行记录与踩坑：docs/reports/Nginx反代与限流-执行记录.md
# ============================================================

worker_processes  1;

events {
    worker_connections  2048;
}

http {
    access_log  logs/spro_access.log;
    error_log   logs/spro_error.log warn;

    # ---- 限流参数：按 IP 请求速率 + 并发连接上限 ----
    limit_req_zone  $binary_remote_addr zone=spro_rate:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=spro_conn:10m;

    # 超额时返回 503（默认是 503，显式写出来便于答辩说明）
    limit_req_status  503;
    limit_conn_status 503;

    upstream spro_backend {
        server 127.0.0.1:3001;
        keepalive 64;
    }

    # ① 纯反代，无限流 —— 给压测 B 组当基线
    server {
        listen       8080;
        server_name  localhost;

        location = /nginx-health {
            access_log off;
            return 200 "nginx ok\n";
        }

        location /v1/ {
            proxy_pass             http://spro_backend;
            proxy_http_version     1.1;
            proxy_set_header       Connection "";
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout  5s;
            proxy_read_timeout     30s;
        }
    }

    # ② 反代 + 限流（生产配置）—— 给 C 组和 503 演示
    server {
        listen       8088;
        server_name  localhost;

        location /v1/ {
            limit_req  zone=spro_rate burst=40 nodelay;
            limit_conn spro_conn 50;

            proxy_pass             http://spro_backend;
            proxy_http_version     1.1;
            proxy_set_header       Connection "";
            proxy_set_header       Host $host;
            proxy_set_header       X-Real-IP $remote_addr;
            proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout  5s;
            proxy_read_timeout     30s;
        }
    }
}
