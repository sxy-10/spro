worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 10240;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 1m;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/plain;

    # Requires the ngx_brotli filter and static modules in the Nginx build.
    brotli on;
    brotli_comp_level 5;
    brotli_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/plain;

    log_format main '$remote_addr [$time_local] "$request" $status '
                    'rt=$request_time urt=$upstream_response_time';
    access_log logs/access.log main;
    error_log logs/error.log warn;

    limit_req_zone $binary_remote_addr zone=seckill_ip:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=poll_ip:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=auth_ip:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=api_ip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_ip:10m;

    upstream travel_api {
        server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;

        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location ~* \.(?:js|css|webp|avif|png|jpe?g|gif|svg|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            try_files $uri =404;
        }

        location = /v1/im/ws {
            limit_conn conn_ip 200;
            proxy_pass http://travel_api;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location ~ ^/v1/seckill/[^/]+$ {
            limit_req zone=seckill_ip burst=3 nodelay;
            limit_conn conn_ip 2;
            limit_req_status 429;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            proxy_pass http://travel_api;
        }

        location ~ ^/v1/seckill/result/ {
            limit_req zone=poll_ip burst=10 nodelay;
            limit_req_status 429;
            proxy_read_timeout 5s;
            proxy_pass http://travel_api;
        }

        location ~ ^/v1/auth/(login|register|sms|captcha|refresh)$ {
            limit_req zone=auth_ip burst=5 nodelay;
            limit_conn conn_ip 5;
            limit_req_status 429;
            proxy_read_timeout 10s;
            proxy_pass http://travel_api;
        }

        location ~ ^/v1/(chat|ai) {
            limit_req zone=api_ip burst=20;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass http://travel_api;
        }

        location /v1/ {
            limit_req zone=api_ip burst=40 nodelay;
            limit_req_status 429;
            proxy_read_timeout 60s;
            proxy_pass http://travel_api;
        }

        location = /health {
            proxy_pass http://travel_api;
            access_log off;
        }

        location / {
            if ($uri ~ "^/internal(/|$)") {
                return 404;
            }
            try_files $uri $uri/ /index.html;
        }

        error_page 429 = @too_many;
        error_page 503 = @busy;

        location @too_many {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"code":20014,"message":"请求过于频繁，请稍后重试","data":null,"trace_id":"gateway"}';
        }

        location @busy {
            default_type application/json;
            add_header Retry-After 2 always;
            return 503 '{"code":50001,"message":"服务暂时不可用，请稍后重试","data":null,"trace_id":"gateway"}';
        }
    }
}
