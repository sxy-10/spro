# ============================================================================
# deploy/nginx/nginx.conf  （组员6 · 阶段六「网关限流」）
#
# 启动：nginx -c <绝对路径>/deploy/nginx/nginx.conf -t   # 先测语法
#       nginx -c <绝对路径>/deploy/nginx/nginx.conf
# 说明：
#   1. 网关只做「粗粒度」限流（IP / 连接数 / 入口速率），
#      用户维度（同一账号不能连点）由后端 Redis 令牌桶负责，见 api/core.ts。
#   2. 秒杀卖多少份不归网关管 —— 那是 Redis Lua 预扣 + MySQL 乐观锁的事。
#   3. 后端必须 TRUST_PROXY=1，否则 req.ip 全是 127.0.0.1，全站共用一个限流桶。
# ============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 10240;
    multi_accept on;
}

http {
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 1m;
    server_tokens off;
    limit_req_log_level warn;

    log_format main '$remote_addr [$time_local] "$request" $status '
                    'rt=$request_time urt=$upstream_response_time';
    access_log logs/access.log main;
    error_log  logs/error.log warn;

    # ---- 限流桶：不同接口的「一个人正常频率」完全不同，必须分开建 zone ----
    limit_req_zone  $binary_remote_addr zone=seckill_ip:10m rate=5r/s;    # 抢购下单
    limit_req_zone  $binary_remote_addr zone=poll_ip:10m    rate=3r/s;    # 抢购结果轮询（1s 一次）
    limit_req_zone  $binary_remote_addr zone=auth_ip:10m    rate=1r/s;    # 登录/短信/验证码
    limit_req_zone  $binary_remote_addr zone=api_ip:10m     rate=20r/s;   # 普通接口
    limit_conn_zone $binary_remote_addr zone=conn_ip:10m;

    # ---- 后端 upstream：keepalive 必须配合 proxy_http_version 1.1 + Connection "" ----
    upstream travel_api {
        server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 8080;
        server_name _;

        # 若前面还有一层反代/CDN，把这两行打开，否则 $binary_remote_addr 是上一跳 IP
        # set_real_ip_from 172.16.0.0/12;
        # real_ip_header X-Forwarded-For;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;

        # 1) 抢购下单：最严。真人手点极限约 3 次/秒，5r/s 只拦脚本
        location ~ ^/v1/seckill/[^/]+$ {
            limit_req  zone=seckill_ip burst=3 nodelay;
            limit_conn conn_ip 2;
            limit_req_status 429;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            proxy_pass http://travel_api;
        }

        # 2) 抢购结果轮询：单独放宽，绝不能和下单共用一个桶
        location ~ ^/v1/seckill/result/ {
            limit_req  zone=poll_ip burst=10 nodelay;
            limit_req_status 429;
            proxy_read_timeout 5s;
            proxy_pass http://travel_api;
        }

        # 3) 登录 / 验证码 / 短信：防刷（后端还有 10 次/分钟/账号 的锁定）
        location ~ ^/v1/auth/(login|register|sms|captcha|refresh)$ {
            limit_req  zone=auth_ip burst=5 nodelay;
            limit_conn conn_ip 5;
            limit_req_status 429;
            proxy_read_timeout 10s;
            proxy_pass http://travel_api;
        }

        # 4) AI / 聊天：慢请求，超时给足，且必须关 buffering（流式输出）
        location ~ ^/v1/(chat|ai) {
            limit_req  zone=api_ip burst=20;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass http://travel_api;
        }

        # 5) 其余 API
        location /v1/ {
            limit_req  zone=api_ip burst=40 nodelay;
            limit_req_status 429;
            proxy_read_timeout 30s;
            proxy_pass http://travel_api;
        }

        # 6) 前端页面（开发态 Vite；生产换成静态目录 root）
        location / {
            proxy_pass http://127.0.0.1:5173;
            proxy_set_header Host $host;
        }

        location = /health {
            proxy_pass http://travel_api;
            access_log off;
        }

        # 网关自己产生的 429/503 也返回 JSON，否则前端 http.ts 解析响应体会抛异常
        error_page 429 = @too_many;
        error_page 503 = @busy;

        location @too_many {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"code":20014,"message":"请求过于频繁，请稍后重试","data":null,"trace_id":"gateway"}';
        }

        location @busy {
            default_type application/json;
            add_header Retry-After 2 always;
            return 503 '{"code":50001,"message":"服务暂时不可用，请稍后重试","data":null,"trace_id":"gateway"}';
        }
    }
}
